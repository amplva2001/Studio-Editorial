<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Editorial</title>
<style>
  :root{--bg:#f4efe8;--ink:#1b1a19;--muted:#6b645c;--card:#fff;--line:#e4dcd1}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1a19;--ink:#f4efe8;--muted:#b5aea6;--card:#262422;--line:#3a3632}}
  *{box-sizing:border-box;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:64px 16px}
  main{max-width:760px;margin:0 auto}
  h1{font-size:44px;font-weight:500;letter-spacing:-1px;margin-bottom:8px}
  p.lead{color:var(--muted);margin-bottom:36px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  a.card{display:flex;flex-direction:column;gap:8px;min-height:180px;justify-content:flex-end;padding:24px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s}
  a.card:hover{transform:translateY(-2px)}
  a.card b{font-size:24px;font-weight:500}
  a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Studio Editorial</h1>
  <p class="lead">Prosjekter</p>
  <div class="grid">
    <a class="card" href="Taki/"><b>Taki</b><span>Tilsyn-prototyper</span></a>
    <a class="card" href="Taki_oracle/"><b>Taki Oracle</b><span>Innsats: snakk, trykk, skriv + tilsyn</span></a>
    <a class="card" href="workshop-data/"><b>Workshop Data</b><span>Hvor mye koster en rute?</span></a>
    <a class="card" href="Usertest_1/"><b>User test 1</b><span>Involvering: kontroll, informasjon, spådommer og handling</span></a>
    <a class="card" href="Taki_oracle_v2/"><b>Taki Oracle v2</b><span>Ny prototype</span></a>
    <a class="card" href="Taki_oracle_v3/"><b>Taki Oracle v3</b><span>Scenarier: Anna og Magnus</span></a>
  </div>
</main>
</body>
</html>
