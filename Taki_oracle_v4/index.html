<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taki Oracle v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e6e3;--card:#f8f8f6;--screen:#efefec;--ink:#121212;--soft:rgba(18,18,18,.55);--line:rgba(18,18,18,.1);--grey-t:#a9a9a5;--mono:"JetBrains Mono",ui-monospace,monospace;
--speak:#1e9e57;--tap:#ff5b26;--write:#f6c400;
--taki:#121212;--you:#2f6fe4;--world:#1e9e57;--human:#7a4fe8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"Inter Tight",Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding:40px 16px 60px}
main{max-width:1180px;margin:0 auto}
.back{font-size:13px;font-weight:500;color:var(--soft);text-decoration:none}
.back:hover{color:var(--ink)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:18px 0 26px}
h1{font-size:48px;font-weight:700;letter-spacing:-.04em;line-height:.95}
h1 span{color:var(--grey-t)}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px}
.tabs button{font:600 14px/1 "Inter Tight",sans-serif;border:0;background:none;padding:11px 18px;border-radius:999px;cursor:pointer;color:var(--soft)}
.tabs button.on{background:var(--ink);color:#fff}

.layout{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}.stage{order:-1}}

/* scenario panel */
.panel{background:var(--card);border-radius:26px;padding:24px}
.who h2{font-size:30px;font-weight:700;letter-spacing:-.03em}
.who p{font-size:14px;color:var(--soft);line-height:1.45;margin-top:6px;max-width:560px}
.goal{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.goal div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.3}
.goal small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px;align-items:center;font-size:12px;color:var(--soft)}
.steps{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px;border-radius:18px;cursor:pointer;border:1px solid transparent}
.steps li:hover{background:#fff}
.steps li.on{background:#fff;border-color:var(--line);box-shadow:0 4px 16px rgba(0,0,0,.05)}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--mono)}
.steps li.on .n{background:var(--ink);color:#fff}
.steps .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.steps b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.steps p{font-size:13.5px;line-height:1.45;color:var(--soft);margin-top:4px;display:none}
.steps li.on p{display:block;color:var(--ink)}
.req{display:none;flex-wrap:wrap;gap:5px;margin-top:8px}
.steps li.on .req{display:flex}
.req span{font-family:var(--mono);font-size:10px;letter-spacing:.03em;padding:4px 7px;border-radius:6px;background:var(--bg);color:var(--ink)}
.point{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--ink);color:#f3f3f1;font-size:14px;line-height:1.45}
.point b{font-weight:700}

/* data labels */
.src{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 var(--mono);letter-spacing:.02em;padding:4px 6px;border-radius:6px;color:#fff;white-space:nowrap}
.src.taki{background:var(--taki)}.src.you{background:var(--you)}.src.world{background:var(--world)}.src.human{background:var(--human)}

/* stage */
.stage{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
@media (max-width:900px){.stage{position:static}}
.phone{width:320px;height:660px;border-radius:52px;background:#111;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.scr{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;display:flex;flex-direction:column;background:var(--screen)}
.scr.anna{background:linear-gradient(160deg,#f7c7b6 0%,#f3a9a0 35%,#d98fb3 70%,#a98bd6 100%)}
.scr.magnus{background:linear-gradient(160deg,#5b6ee8 0%,#4b8fe0 40%,#38b8b0 75%,#7fd17a 100%)}
.status{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 0;font-weight:600;font-size:14px;height:44px;flex:0 0 auto}
.scr.anna .status,.scr.magnus .status{color:#fff}
.island{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:96px;height:28px;border-radius:20px;background:#000;z-index:3}
.batt{display:block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.batt::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.body{flex:1;overflow:auto;padding:12px 16px 16px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.nav{display:flex;gap:10px;align-items:center}
.nav button{font:600 13px/1 "Inter Tight",sans-serif;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav .cnt{font-family:var(--mono);font-size:12px;color:var(--soft);min-width:48px;text-align:center}

/* home widgets */
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:57px;gap:13px;padding:14px 2px 0}
.w{border-radius:22px;padding:11px 12px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);position:relative}
.w.s{grid-column:span 2;grid-row:span 2}.w.m{grid-column:span 4;grid-row:span 2}.w.l{grid-column:span 4;grid-row:span 4}
.w .hd{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;opacity:.85}
.w .hd svg{width:15px;height:15px;border-radius:4px;flex:0 0 auto}
.w .hd{flex-wrap:wrap;row-gap:5px}
.w .hd .src{margin-left:auto;font-size:8px;padding:3px 5px}
.w.s .hd .src{margin-left:21px;order:3;flex-basis:auto}
.w.s .hd span:not(.src){flex:1}
.w .ok~.lbl,.w .lbl{padding-right:0}
.w.fin .lbl{padding-right:24px}
.w .big{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:auto;white-space:nowrap}
.w .lbl{font-size:11.5px;font-weight:600;line-height:1.25;margin-top:4px}
.w .row{display:flex;gap:12px;flex:1;margin-top:4px}
.w .row>div{flex:1;display:flex;flex-direction:column;min-width:0}
.w .ok{position:absolute;right:10px;bottom:10px;width:20px;height:20px;border-radius:50%;background:var(--speak);color:#fff;font:700 12px/20px sans-serif;text-align:center}
.w.tapme{cursor:pointer;outline:3px solid rgba(255,255,255,.95);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(255,255,255,.2)}}
.bars{display:flex;align-items:flex-end;gap:4px;height:58px;margin-top:auto}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bars b{display:block;width:100%;border-radius:4px;background:var(--c,#121212)}
.bars b.f{opacity:.35}
.bars b.hi{opacity:1}
.bars small{font-size:8.5px;font-family:var(--mono);opacity:.6}
.banner{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.35;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.banner svg{width:30px;height:30px;border-radius:8px;flex:0 0 auto}
.banner b{display:block;font-size:12px}

/* app screens */
.app{display:flex;flex-direction:column;gap:10px}
.apphd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--soft);margin-bottom:2px}
.apphd svg{width:22px;height:22px;border-radius:6px}
.apphd .bk{margin-right:auto;cursor:pointer}
.orb{display:flex;gap:10px;align-items:flex-start}
.orb .o{width:36px;height:36px;border-radius:50%;background:#121212;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative}
.orb .o svg{width:22px;height:22px}
.orb .o::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--speak);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .say{background:#fff;border-radius:4px 18px 18px 18px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.card{background:#fff;border-radius:20px;padding:13px}
.card h4{font-size:12px;font-weight:600;color:var(--soft);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card h4 .src{margin-left:auto}
.card .t{font-size:13.5px;line-height:1.45}
.card .mail{font-size:12.5px;line-height:1.45;background:var(--screen);border-radius:12px;padding:10px;margin-top:6px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv.tot{font-weight:700;font-size:15px}
.srcs{display:flex;gap:5px;flex-wrap:wrap}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.act{display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:12px 13px;font:600 14px/1.2 "Inter Tight",sans-serif;cursor:pointer;text-align:left;background:#fff;color:var(--ink)}
.act.main{background:var(--ink);color:#fff}
.act .e{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff}
.act .e .ico{width:16px;height:16px}
.act .e.speak{background:var(--speak)}.act .e.tap{background:var(--tap)}.act .e.write{background:var(--write);color:#121212}
.act small{display:block;font-weight:500;font-size:11px;opacity:.6;margin-top:2px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice .act{flex-direction:column;align-items:flex-start;min-height:84px}
.ico{display:block;width:100%;height:100%;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.post{background:#fff;border-radius:20px;overflow:hidden}
.post .ph{height:190px;background:linear-gradient(135deg,#f6d36b,#e7a33b 55%,#b86a22);display:flex;align-items:center;justify-content:center}
.post .ph svg{width:150px;height:150px}
.post .cap{padding:11px 13px;font-size:13px;line-height:1.4}
.post .cap b{font-weight:700}
.why{font-size:12px;line-height:1.4;background:#fff;border-radius:16px;padding:10px 12px}
.why div{padding:3px 0}.why b{display:inline-block;width:46px;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--soft)}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.heat i{height:22px;border-radius:5px;background:var(--speak)}
.heat span{font-family:var(--mono);font-size:9px;color:var(--soft);text-align:center}
.slider{margin-top:6px}
.slider input{width:100%;accent-color:#121212}
.slider .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--soft)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;margin-top:6px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.big2{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.prog{height:8px;background:var(--screen);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--speak);border-radius:4px}
.done{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.done:first-of-type{border-top:0}
.done i{width:20px;height:20px;border-radius:50%;background:var(--speak);color:#fff;font:700 11px/20px sans-serif;text-align:center;font-style:normal;flex:0 0 auto}
</style>
<style>
/* ---- v4 additions ---- */
/* basis line: what the conclusion is based on */
.basis{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;line-height:1.3;color:var(--soft);margin-top:6px}
.basis i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:3px}
.basis i.taki{background:var(--taki)}.basis i.you{background:var(--you)}.basis i.world{background:var(--world)}.basis i.human{background:var(--human)}
.w .basis{font-size:9.5px;margin-top:6px}
.w.urgent{background:#121212;color:#fff}
.w.urgent .basis{color:rgba(255,255,255,.6)}
.w.urgent .basis i.taki{background:#fff}
.w.urgent .hd svg rect{fill:#fff}
.w.urgent .hd svg path{fill:#121212}
.w.urgent .flag{font:600 9px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;background:var(--tap);color:#fff;padding:3px 6px;border-radius:5px;margin-left:auto}
.w.calm{background:rgba(255,255,255,.82)}
.holdhint{font-family:var(--mono);font-size:10px;color:var(--soft);text-align:center}
[data-why]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
[data-why].holding{transform:scale(.97);transition:transform .15s}

/* status widget: done / working / asking */
.st{display:flex;flex-direction:column;gap:0;margin-top:6px}
.st .r{display:grid;grid-template-columns:24px 1fr;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:11.5px;line-height:1.35}
.st .r:first-child{border-top:0;padding-top:2px}
.st .r small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:2px}
.st .ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px/1 sans-serif;color:#fff}
.st .ic.done{background:var(--speak)}
.st .ic.work{background:#fff;border:2px solid var(--line);border-top-color:#121212;animation:spin 1.2s linear infinite}
.st .ic.ask{background:var(--tap)}
.st .yn{display:flex;gap:6px;margin-top:6px}
.st .yn button{font:600 11px/1 "Inter Tight",sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.st .yn button.y{background:#121212;color:#fff;border-color:#121212}
.st .ans{font-weight:600;color:var(--speak);margin-top:4px}

/* news widget: background = the article's main image */
.w.news{color:#fff;padding:0;background:#333}
.w.news.m{grid-row:span 3}
.w.news .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.w.news .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.35) 40%,rgba(0,0,0,.85) 100%)}
.w.news .in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:11px 12px}
.w.news .srcn{display:flex;align-items:center;gap:6px;font:600 10px/1 var(--mono);letter-spacing:.03em;opacity:.9}
.w.news .srcn .lk{margin-left:auto;font-size:10px;background:rgba(255,255,255,.2);padding:4px 7px;border-radius:999px;color:#fff;text-decoration:none;backdrop-filter:blur(6px)}
.w.news .hl{font-size:13px;font-weight:600;line-height:1.25;margin-top:auto}
.w.news .rec{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;font-weight:700;background:#fff;color:#121212;padding:6px 9px;border-radius:999px;align-self:flex-start}
.w.news .rec i{width:8px;height:8px;border-radius:50%}
.w.news .basis{color:rgba(255,255,255,.7)}
.w.news .basis i.world{background:#7be0a6}

/* why-overlay (press and hold) */
.whyov{position:absolute;inset:0;z-index:20;background:rgba(18,18,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .15s}
.whyov.on{opacity:1}
.whyov .sheet{background:#fff;border-radius:28px 28px 0 0;width:100%;padding:18px 18px 26px;transform:translateY(30px);transition:transform .2s}
.whyov.on .sheet{transform:none}
.whyov .k{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.whyov h5{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:4px 0 10px;line-height:1.2}
.whyov ol{list-style:none;counter-reset:w;display:flex;flex-direction:column;gap:9px}
.whyov li{counter-increment:w;display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:12.5px;line-height:1.4}
.whyov li::before{content:counter(w);width:20px;height:20px;border-radius:50%;background:var(--screen);font:600 10px/20px var(--mono);text-align:center}
.whyov .from{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.whyov .from span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:5px 8px;border-radius:999px;background:var(--screen)}
.whyov .from i{width:7px;height:7px;border-radius:50%}
.whyov .conf{margin-top:10px;font-size:11px;color:var(--soft)}
.whyov .conf b{color:var(--ink)}
.changes{margin-top:14px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:12.5px;line-height:1.5}
.changes b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:4px}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Studio Editorial</a>
  <header class="top">
    <h1>Taki Oracle<br><span>v4 · Scenarios</span></h1>
    <div class="tabs"><button data-p="anna">Anna · stay afloat</button><button data-p="magnus">Magnus · grow</button></div>
  </header>
  <div class="layout">
    <section class="panel" id="panel"></section>
    <aside class="stage">
      <div class="phone"><div class="scr" id="scr"></div></div>
      <div class="holdhint">Press and hold any card to see why</div>
      <div class="nav"><button id="prev">← Back</button><span class="cnt" id="cnt"></span><button id="next">Next →</button></div>
    </aside>
  </div>

 const hx='<line x1="'+x(hire)+'" x2="'+x(hire)+'" y1="8" y2="'+(H-14)+'" stroke="#ff5b26" stroke-width="1.5"/><text x="'+(x(hire)+3)+'" y="14" font-size="8" font-family="JetBrains Mono" fill="#ff5b26">hire</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+goal+band+line(f.none,'#121212',1,1.5)+line(f.plaus,'#f6c400')+line(f.pref,'#1e9e57')+line(f.prob,'#2f6fe4',0,3)+hx+m+'</svg>';
}
function whatifText(){const f=future(hire),d=f.prob[5]-f.none[5],mo=['July','August','September','October','November','December'][hire];
 return 'Hire in <b>'+mo+'</b>: by December you’ll likely earn <b>'+(d>=0?'+':'')+d+' 000 kr</b> a month after salary'+(hire>=4?', but May will be chaos again first.':', and get 10 hours a week back.')}

 W({size:'s',name:'Accountant',why:'m_acct',body:'<div class="big">Kari</div><div class="lbl">ready when you are</div>',basis:['human','Before big choices']})+

/* ---------------- render ---------------- */
const P={anna:ANNA,magnus:MAGNUS};
let cur='anna',step=0;
try{const s=JSON.parse(localStorage.getItem('taki-oracle-v4')||'null');if(s&&P[s.cur]){cur=s.cur;step=Math.min(s.step|0,P[cur].steps.length-1)}}catch(e){}
function renderPanel(){
 const d=P[cur];
 document.getElementById('panel').innerHTML=
  '<div class="who"><h2>'+d.who+'</h2><p>'+d.desc+'</p></div>'+
  '<div class="goal">'+d.goal.map(g=>'<div><small>'+g[0]+'</small>'+g[1]+'</div>').join('')+'</div>'+
  '<ol class="steps">'+d.steps.map((s,i)=>'<li data-s="'+i+'" class="'+(i===step?'on':'')+'"><span class="n">'+(i+1)+'</span><div><span class="when">'+s.when+'</span><b>'+s.t+'</b><p>'+s.p+'</p><div class="req">'+s.req.map(r=>'<span>'+r+'</span>').join('')+'</div></div></li>').join('')+'</ol>'+
  '<div class="point">'+d.point+'</div>'+
  '<div class="changes"><b>New in v4</b>1. Every card says what it’s based on. Press and hold for why.<br>2. Black = look at this first.<br>3. Taki says what it finished, what it’s working on, and asks before it starts.<br>4. News widget with the article’s photo, a link to read it, and a clear tip.</div>';
}
function render(){
 const d=P[cur],s=d.steps[step];
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===cur));
 const scr=document.getElementById('scr');
 scr.className='scr'+(s.scr==='home'?' '+cur:'');
 scr.innerHTML='<div class="status"><span>9:41</span><div class="island"></div><span class="batt"></span></div><div class="body">'+s.html()+'</div><div class="whyov" id="whyov"><div class="sheet"></div></div>';
 renderPanel();
 document.getElementById('cnt').textContent=(step+1)+' / '+d.steps.length;
 document.getElementById('prev').disabled=step===0;
 document.getElementById('next').disabled=step===d.steps.length-1;
 try{localStorage.setItem('taki-oracle-v4',JSON.stringify({cur,step}))}catch(e){}
}
function go(i){const n=P[cur].steps.length;step=Math.max(0,Math.min(n-1,i));render()}

/* press and hold → why */
let holdT=null,held=false,holdEl=null;
function showWhy(id){
 const w=WHY[id];if(!w)return;
 const ov=document.getElementById('whyov');
 ov.querySelector('.sheet').innerHTML='<div class="k">Why · '+w.k+'</div><h5>'+w.h+'</h5><ol>'+w.p.map(x=>'<li>'+x+'</li>').join('')+'</ol><div class="from">'+w.f.map(f=>'<span><i style="background:'+KC[f[0]]+'"></i>'+f[1]+'</span>').join('')+'</div><div class="conf">How sure: <b>'+w.c+'</b> · release to close</div>';
 ov.classList.add('on');
}
function hideWhy(){const ov=document.getElementById('whyov');if(ov)ov.classList.remove('on');if(holdEl)holdEl.classList.remove('holding');holdEl=null}
document.addEventListener('pointerdown',e=>{
 held=false;
 const el=e.target.closest('[data-why]');if(!el||e.target.closest('button,a,input'))return;
 held=false;holdEl=el;el.classList.add('holding');
 holdT=setTimeout(()=>{held=true;showWhy(el.dataset.why)},380);
});
const endHold=()=>{clearTimeout(holdT);if(held)setTimeout(hideWhy,0);else if(holdEl){holdEl.classList.remove('holding');holdEl=null}};
document.addEventListener('pointerup',endHold);
document.addEventListener('pointercancel',()=>{clearTimeout(holdT);hideWhy()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-why]'))e.preventDefault()});

document.addEventListener('click',e=>{
 if(held){held=false;e.preventDefault();return}
 const t=e.target.closest('.tabs button');if(t){cur=t.dataset.p;step=0;render();return}
 const li=e.target.closest('.steps li');if(li){go(+li.dataset.s);return}
 const a=e.target.closest('[data-ask]');if(a){ASK[a.dataset.ask]=a.dataset.v;const b=document.querySelector('.body');const y=b?b.scrollTop:0;render();const b2=document.querySelector('.body');if(b2)b2.scrollTop=y;return}
 if(e.target.closest('[data-home]')){go(0);return}
 if(e.target.closest('[data-next]')){go(step+1);return}
},true);
document.getElementById('prev').onclick=()=>go(step-1);
document.getElementById('next').onclick=()=>go(step+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1)});
document.addEventListener('input',e=>{if(e.target.id==='hire'){hire=+e.target.value;document.getElementById('ch').innerHTML=chart();document.getElementById('wt').innerHTML=whatifText()}});
render();
</script>
